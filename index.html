<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Impacto Ambiental</title>
</head>
<body>

    <h1>Calculadora de Impacto Ambiental</h1>
    <p>Calcula tu impacto ecológico durante una semana escolar de 5 días.</p>

    <form id="ecoForm">

        <label for="transporte">Medio de transporte:</label>
        <select id="transporte" required>
            <option value="">Selecciona una opción</option>
            <option value="bus">Bus</option>
            <option value="carro">Carro privado</option>
            <option value="compartido">Carro compartido</option>
            <option value="bicicleta">Bicicleta</option>
            <option value="caminando">Caminando</option>
        </select>

        <br><br>

        <label for="papel">Cantidad de hojas utilizadas al día:</label>
        <input type="number" id="papel" min="0" step="1" required>

        <br><br>

        <label for="reciclaje">Nivel de reciclaje:</label>
        <select id="reciclaje" required>
            <option value="">Selecciona una opción</option>
            <option value="bajo">Bajo</option>
            <option value="medio">Medio</option>
            <option value="alto">Alto</option>
        </select>

        <br><br>

        <button type="submit">Calcular impacto ambiental</button>

    </form>

    <h2>Resultados</h2>
    <div id="resultados">
        <p>Completa el formulario para conocer tu impacto ambiental.</p>
    </div>

    <script>

        const form = document.getElementById("ecoForm");

        form.addEventListener("submit", function(event) {

            event.preventDefault();

            // Obtener los valores del formulario
            const transporte = document.getElementById("transporte").value;
            const papel = Number(document.getElementById("papel").value);
            const reciclaje = document.getElementById("reciclaje").value;

            // Validar los datos
            if (transporte === "" || reciclaje === "" ||
                document.getElementById("papel").value === "" ||
                !Number.isInteger(papel) || papel < 0) {

                alert("Por favor, completa todos los campos correctamente.");
                return;
            }

            // Factores estimados de emisión por día (kg de CO2)
            const emisionesTransporte = {
                bus: 0.8,
                carro: 4.0,
                compartido: 1.5,
                bicicleta: 0,
                caminando: 0
            };

            // Emisiones estimadas por hoja de papel (kg de CO2)
            const emisionPorHoja = 0.005;

            // Calcular emisiones de transporte durante 5 días
            const co2Transporte = emisionesTransporte[transporte] * 5;

            // Calcular emisiones del consumo de papel durante 5 días
            const co2Papel = papel * 5 * emisionPorHoja;

            // Calcular emisiones totales semanales
            const co2Total = co2Transporte + co2Papel;

            // Calcular Eco-Points según el nivel de reciclaje
            let ecoPoints = 0;

            if (reciclaje === "bajo") {
                ecoPoints = 20;
            } else if (reciclaje === "medio") {
                ecoPoints = 50;
            } else if (reciclaje === "alto") {
                ecoPoints = 100;
            }

            // Puntos adicionales por transporte sostenible
            if (transporte === "bicicleta" || transporte === "caminando") {
                ecoPoints += 30;
            } else if (transporte === "compartido") {
                ecoPoints += 20;
            } else if (transporte === "bus") {
                ecoPoints += 10;
            }

            // Restar puntos según el consumo de papel
            ecoPoints -= Math.floor(papel / 5) * 5;

            // Evitar puntajes negativos o superiores a 100
            ecoPoints = Math.max(0, Math.min(100, ecoPoints));

            // Mostrar resultados
            document.getElementById("resultados").innerHTML = `
                <h3>Tu impacto ambiental semanal:</h3>
                <p><strong>Emisiones del transporte:</strong> ${co2Transporte.toFixed(2)} kg de CO2</p>
                <p><strong>Emisiones del papel:</strong> ${co2Papel.toFixed(2)} kg de CO2</p>
                <p><strong>Emisiones totales:</strong> ${co2Total.toFixed(2)} kg de CO2</p>
                <p><strong>Eco-Points:</strong> ${ecoPoints} / 100</p>
            `;

        });

    </script>

</body>
</html>
